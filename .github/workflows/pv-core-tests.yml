name: PV core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run reference and atomic-write tests
        run: python -m unittest -v test_pv_validation.py
      - name: Run SVG arc geometry tests
        run: python test_arc_direction.py
